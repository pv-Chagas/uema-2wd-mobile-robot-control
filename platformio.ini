; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = supermini

[env:supermini]
; Plataforma "pioarduino": traz o núcleo Arduino-ESP32 3.x (a oficial do PlatformIO é mais antiga)
platform = espressif32 @ ^6.8.1
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Serial pela porta USB nativa da SuperMini (equivale a "USB CDC On Boot" da Arduino IDE).
; CORE_DEBUG_LEVEL=0 evita que mensagens de depuração do núcleo se misturem ao protocolo da IHM.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.2
    bblanchon/ArduinoJson@^7.0.0